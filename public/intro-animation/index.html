<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Intro Animation — Swiss Style</title>
  
  <!-- Modern Neo-grotesque font: Inter Tight -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  
  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="loading">

  <!-- =========================================================
       1. PRELOADER & CURTAIN OVERLAY
       ========================================================= -->
  <div id="loaderOverlay" class="loader-overlay">
    <!-- Tiny centered counter -->
    <div id="loaderCounter" class="loader-counter">0%</div>
  </div>

  <!-- Curtain Lift Overlay (panel that retracts upward with darkening shadow) -->
  <div id="curtainPanel" class="curtain-panel"></div>

  <!-- =========================================================
       HERO PAGE CONTAINER (Revealed Underneath)
       ========================================================= -->
  <div class="hero-page">

    <!-- TOP NAV ROW -->
    <header class="top-nav">
      <!-- Left Pill -->
      <div class="nav-item nav-left">
        <a href="#top" class="brand-pill">&copy;TousifAzam</a>
      </div>

      <!-- Center Links with Superscripts -->
      <nav class="nav-item nav-center" aria-label="Main Navigation">
        <a href="#work" class="nav-link">Work <sup>(10)</sup></a>
        <a href="#archive" class="nav-link">Archive <sup>(10)</sup></a>
        <a href="#about" class="nav-link">About</a>
      </nav>

      <!-- Right Link -->
      <div class="nav-item nav-right">
        <a href="#contact" class="nav-link get-in-touch">Get in touch</a>
      </div>
    </header>

    <!-- CENTER HERO CONTENT -->
    <main class="hero-main">
      <div class="display-name-wrap">
        <!-- Giant Display Name ("Matt [image] hieu") -->
        <h1 class="display-name" aria-label="Matthieu">
          <!-- Left half: "Matt" with masked individual letters -->
          <span class="name-half name-left" id="nameLeft">
            <span class="letter-mask"><span class="char">M</span></span>
            <span class="letter-mask"><span class="char">a</span></span>
            <span class="letter-mask"><span class="char">t</span></span>
            <span class="letter-mask"><span class="char">t</span></span>
          </span>

          <!-- Expanding Image Slot (Starts at width 0, expands smoothly) -->
          <span class="slot-wrapper" id="slotWrapper">
            <span class="slot-perspective" id="slotPerspective">
              <span class="slot-card" id="slotCard">
                <!-- Purple Tint Overlay (settles into image) -->
                <span class="slot-tint" id="slotTint"></span>
                
                <!-- Cycling Slideshow Thumbnails -->
                <div class="thumbnail-slides" id="thumbnailSlides">
                  <img src="../thumbnails/project-2.jpg" alt="Showcase 1" class="thumb-slide active" />
                  <img src="../thumbnails/aftermovie.jpg" alt="Showcase 2" class="thumb-slide" />
                  <img src="../thumbnails/flashmob.jpg" alt="Showcase 3" class="thumb-slide" />
                  <img src="../thumbnails/project-4.jpg" alt="Showcase 4" class="thumb-slide" />
                  <img src="../thumbnails/75 days to go.jpg" alt="Showcase 5" class="thumb-slide" />
                </div>
              </span>
            </span>
          </span>

          <!-- Right half: "hieu" with masked individual letters -->
          <span class="name-half name-right" id="nameRight">
            <span class="letter-mask"><span class="char">h</span></span>
            <span class="letter-mask"><span class="char">i</span></span>
            <span class="letter-mask"><span class="char">e</span></span>
            <span class="letter-mask"><span class="char">u</span></span>
          </span>
        </h1>
      </div>

      <!-- 3-Line Centered Subtitle (line-by-line mask reveal) -->
      <div class="subtitle-wrap">
        <div class="subtitle-line-mask">
          <p class="subtitle-line line-1">Front-end developer and</p>
        </div>
        <div class="subtitle-line-mask">
          <p class="subtitle-line line-2">designer - based in Australia</p>
        </div>
        <div class="subtitle-line-mask">
          <p class="subtitle-line line-3">[ Queensland ]</p>
        </div>
      </div>
    </main>

    <!-- BOTTOM ROW (Separated by 1px light-grey line) -->
    <footer class="bottom-row">
      <div class="bottom-item bottom-left">
        <span class="approach-tag">[ Approach ]</span>
      </div>
      <div class="bottom-item bottom-center">
        <p class="approach-text">
          <span class="mono-num">01</span> Always looking for simple, thoughtful solutions that fit the project and feel good to use.
        </p>
      </div>
      <div class="bottom-item bottom-right">
        <a href="#about" class="more-link">&rarr; More about me</a>
      </div>
    </footer>

  </div>

  <!-- JavaScript Animation Controller -->
  <script src="script.js"></script>
</body>
</html>
