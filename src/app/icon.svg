<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark badge background for high contrast across dark/light tabs -->
  <rect width="64" height="64" rx="14" fill="#0e0f11"/>
  
  <!-- Film Camera Top Dual Reels -->
  <!-- Left Reel -->
  <circle cx="23" cy="20" r="10" fill="#1c1e22" stroke="#f5f5f7" stroke-width="2.5"/>
  <circle cx="23" cy="20" r="2.5" fill="#f5f5f7"/>
  <circle cx="23" cy="14" r="1.5" fill="#f5f5f7"/>
  <circle cx="29" cy="20" r="1.5" fill="#f5f5f7"/>
  <circle cx="23" cy="26" r="1.5" fill="#f5f5f7"/>
  <circle cx="17" cy="20" r="1.5" fill="#f5f5f7"/>

  <!-- Right Reel -->
  <circle cx="41" cy="20" r="10" fill="#1c1e22" stroke="#f5f5f7" stroke-width="2.5"/>
  <circle cx="41" cy="20" r="2.5" fill="#f5f5f7"/>
  <circle cx="41" cy="14" r="1.5" fill="#f5f5f7"/>
  <circle cx="47" cy="20" r="1.5" fill="#f5f5f7"/>
  <circle cx="41" cy="26" r="1.5" fill="#f5f5f7"/>
  <circle cx="35" cy="20" r="1.5" fill="#f5f5f7"/>

  <!-- Camera Body -->
  <rect x="13" y="27" width="31" height="23" rx="3.5" fill="#f5f5f7"/>
  
  <!-- Body accent groove line -->
  <rect x="13" y="37" width="31" height="3" fill="#0e0f11"/>
  
  <!-- Red Recording Tally Indicator -->
  <circle cx="18" cy="32" r="2.2" fill="#ef4444"/>

  <!-- Cinema Lens Cone -->
  <path d="M44 32L53 28V47L44 43V32Z" fill="#f5f5f7"/>
  
  <!-- Front Matte Box / Lens Rim -->
  <rect x="53" y="26" width="4" height="23" rx="1.5" fill="#f5f5f7"/>
  <line x1="53" y1="28" x2="53" y2="47" stroke="#0e0f11" stroke-width="1.5"/>

  <!-- Viewfinder on Left -->
  <rect x="8" y="30" width="5" height="5" rx="1.5" fill="#f5f5f7"/>
</svg>
